name: Django checks

on:
  push:
    branches: [rewrite-development]
    paths:
      - "v2/**"
      - ".github/workflows/django-checks.yml"
  pull_request:
    branches: [rewrite-development]
    paths:
      - "v2/**"
      - ".github/workflows/django-checks.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: petrodactal_test
          POSTGRES_USER: petrodactal
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U petrodactal -d petrodactal_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: v2
    env:
      DJANGO_SECRET_KEY: ci-only-secret-key-that-is-long-enough-for-django-tests-123456
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      ENCRYPTION_KEY: "MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA="
      DB_NAME: petrodactal_test
      DB_USER: petrodactal
      DB_PASSWORD: test-password
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: v2/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Check Django configuration
        run: python manage.py check
      - name: Check migrations are up to date
        run: python manage.py makemigrations --check --dry-run
      - name: Apply migrations
        run: python manage.py migrate --noinput
      - name: Run tests
        run: python manage.py test
